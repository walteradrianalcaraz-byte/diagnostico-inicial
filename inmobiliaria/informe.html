function nombrePuesto(q) { if (!q) return ''; if (PUESTO[q]) return PUESTO[q].nombre; return /^[pst]-/.test(q) ? '' : q; }
function nombreTarea(id) { return TAREA[id] ? TAREA[id].nombre : ''; }
const NIVEL_TXT = { optimizar: 'Optimizar lo que ya tienen', automatizar: 'Automatizar', ia: 'Inteligencia artificial' };
const NIVEL_CORTO = { optimizar: 'Optimizar', automatizar: 'Automatizar', ia: 'IA' };
const HERR_TIPO = { ya_la_tienen: 'Ya la tienen', gratuita: 'Gratuita', paga_o_gratuita: 'Gratuita o paga', paga: 'Paga' };

/* Traduce un id a un texto para el cliente (nunca muestra el id). */
function dondeTexto(id) {
  if (!id) return '';
  if (PASO[id]) return 'Paso ' + PASO[id].orden + ' de «' + PASO[id]._tarea.nombre + '»';
  if (TAREA[id]) return '«' + TAREA[id].nombre + '»' + (PUESTO[TAREA[id].puesto_id] ? ' · ' + PUESTO[TAREA[id].puesto_id].nombre : '');
  if (PUESTO[id]) return 'Puesto: ' + PUESTO[id].nombre + ' (' + PUESTO[id]._sector.nombre + ')';
  if (SECTOR[id]) return 'Sector: ' + SECTOR[id].nombre;
  if (AREA[id]) return 'Área: ' + AREA[id].nombre;
  if (OP[id]) return 'Recomendación: ' + OP[id].titulo;
  if (CUID[id]) return CUID[id].titulo;
  return '';
}
function tituloRef(ref) { return OP[ref] ? OP[ref].titulo : CUID[ref] ? CUID[ref].titulo : ''; }

/* Lo que queda por confirmar, en un solo lugar. */
const PENDIENTES = (() => {
  const out = [];
  if (F1) arr(F1.por_confirmar).forEach(p => out.push({ grupo: 'Datos del relevamiento', pregunta: p.pregunta, donde: dondeTexto(p.donde), respuestas: arr(p.respuestas) }));
  OPS.forEach(o => arr(o.para_la_reunion).forEach(q => out.push({ grupo: 'Sobre las recomendaciones', pregunta: q, donde: 'Recomendación ' + o._n + ': ' + o.titulo, respuestas: [], op: o.id })));
  if (F3) arr(F3.estado).forEach(b => { if (b.semaforo === 'sin_dato') out.push({ grupo: 'Sobre los cuidados', pregunta: '¿Cómo se manejan hoy las ' + (b.nombre || '').toLowerCase() + '?', donde: arr(b.respuestas).length ? 'Las respuestas no coinciden' : 'No tenemos el dato', respuestas: arr(b.respuestas) }); });
  return out.filter(p => p.pregunta);
})();

/* ---------- piezas visuales comunes ---------- */
function pendiente(titulo, texto) {
  return '<div class="pendiente"><h3>' + esc(titulo || 'Pendiente') + '</h3><p style="margin:0">' + esc(texto || 'Esta parte todavía no está lista. La sumamos apenas terminemos esa fase.') + '</p></div>';
}
function chipArea(id) { return id && AREA[id] ? '<span class="chip chip-area" style="color:' + colorArea(id) + '"><span class="pto"></span><span style="color:var(--texto)">' + esc(nombreArea(id)) + '</span></span>' : ''; }
function chipNivel(n) { return n ? '<span class="chip chip-nivel n-' + esc(n) + '">' + esc(NIVEL_TXT[n] || n) + '</span>' : ''; }
function chipIdea(o) { return o && o.origen === 'idea_consultor' ? '<span class="chip chip-idea" title="Surgió durante la entrevista">Idea surgida en la entrevista</span>' : ''; }
function medidor(n, clase) { let s = '<span class="medidor ' + (clase || '') + '" aria-hidden="true">'; for (let i = 1; i <= 5; i++) s += '<i class="' + (i <= n ? 'on' : '') + '"></i>'; return s + '</span>'; }
function citas(lista) {
  lista = arr(lista).filter(x => x && x.texto);
  return lista.map(x => '<blockquote class="cita"><span class="quien">Contado por ' + esc(articulo(x.fuente)) + '</span>' + esc(x.texto) + '</blockquote>').join('');
}
function articulo(rol) { rol = String(rol || ''); if (!rol) return 'el equipo'; return (/^(Responsable|Jefe|Auxiliar|Analista|Encargado|Ejecutivo|Vendedor|Comprador|Operario|Chofer|Controlador|Liquidador|Diseñador|Cajero|Preventista|Dueño|Consultor|Tesorero)/i.test(rol) ? (/^(Dueña|Encargada|Jefa)/i.test(rol) ? 'la ' : 'el ') : '') + rol.charAt(0).toLowerCase() + rol.slice(1); }

/* Antes y después de una recomendación: pasos de hoy (tachados o reducidos) y pasos nuevos. */
function antesDespues(o) {
  const ad = o.antes_despues || {};
  const efecto = {}; arr(ad.pasos_afectados).forEach(pa => { efecto[pa.paso_id] = pa; });
  const tareas = arr(o.tarea_ids).map(id => TAREA[id]).filter(Boolean);
  const varias = tareas.length > 1;
  let hoy = '', luego = '', nHoy = 0, nLuego = 0;
  tareas.forEach(t => {
    const pasos = arr(t.pasos).slice().sort((a, b) => a.orden - b.orden);
    const tocados = pasos.filter(p => efecto[p.id]);
    if (!tocados.length) return;
    if (varias) { hoy += '<li class="tarea-sep">' + esc(t.nombre) + '</li>'; luego += '<li class="tarea-sep">' + esc(t.nombre) + '</li>'; }
    pasos.forEach(p => {
      const e = efecto[p.id]; nHoy++;
      const clase = e ? e.efecto : 'igual';
      const ic = e ? (e.efecto === 'elimina' ? '✕' : '↓') : p.orden;
      const det = e && e.efecto === 'reduce' ? '<span class="det">Lleva menos tiempo: estimamos entre ' + e.porcentaje_min + ' y ' + e.porcentaje_max + ' % menos</span>' : e && e.efecto === 'elimina' ? '<span class="det">Deja de hacerse</span>' : '';
      hoy += '<li class="' + clase + '"><span class="ic">' + ic + '</span><span><span class="txt">' + esc(p.descripcion) + '</span>' + det + '</span></li>';
      if (!e || e.efecto !== 'elimina') {
        nLuego++;
        luego += '<li class="' + clase + '"><span class="ic">' + (e ? '↓' : p.orden) + '</span><span><span class="txt">' + esc(p.descripcion) + '</span>' + (e ? '<span class="det">Más rápido: entre ' + e.porcentaje_min + ' y ' + e.porcentaje_max + ' % menos de tiempo</span>' : '') + '</span></li>';
      }
    });
  });
  const nuevos = arr(ad.pasos_nuevos);
  if (nuevos.length) {
    luego += '<li class="tarea-sep">Pasos nuevos</li>';
    nuevos.forEach(n => { nLuego++; luego += '<li class="nuevo"><span class="ic">✓</span><span><span class="txt">' + esc(n.descripcion) + '</span><span class="det">' + esc(nombrePuesto(n.quien) || 'Sistema') + '</span></span></li>'; });
  }
  if (!nHoy) return '';
  return '<div class="ad"><div class="ad-col"><div class="ad-cab"><span>Hoy</span><span>' + nHoy + ' ' + plural(nHoy, 'paso', 'pasos') + '</span></div><ol>' + hoy + '</ol></div>' +
    '<div class="ad-flecha" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 30 30"><path d="M6 15h17M17 8l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
    '<div class="ad-col despues"><div class="ad-cab"><span>Con la mejora</span><span>' + nLuego + ' ' + plural(nLuego, 'paso', 'pasos') + '</span></div><ol>' + luego + '</ol></div></div>' +
    '<div class="ad-ley"><span><i style="background:#F4DCD8"></i>Deja de hacerse</span><span><i style="background:var(--acento-suave)"></i>Lleva menos tiempo</span><span><i style="background:#DCE8DD"></i>Paso nuevo</span></div>';
}

function ahorroHTML(o) {
  const a = o.ahorro || {};
  const it = (et, d, dec) => '<div class="ahorro-it"><div class="et">' + et + '</div><div class="v">' + datoHTML(d, { dec: dec }) + '</div>' + (esPC(d) && d && d.motivo ? '<span class="dato-motivo">' + esc(d.motivo) + '</span>' : '') + cuentaHTML(d) + '</div>';
  return '<div class="ahorro">' + it('Horas por mes', a.horas_mes) + it('Dinero por mes', a.dinero_mes) + it('Personas equivalentes', a.personas_equivalentes, 2) + '</div>';
}

/* Ficha completa de una recomendación. o.modo: 'grande' omite el título (lo pone quien llama). */
function fichaOp(o, modo) {
  let h = '';
  if (modo !== 'grande') h += '<div class="ficha-cab">' + chipArea(o.area_id) + chipNivel(o.nivel) + chipIdea(o) + '</div><h3 class="ficha-tit">' + esc(o.titulo) + '</h3>';
  h += '<div class="ficha-par"><div><p class="mini-tit">Hoy</p><p>' + esc(o.hoy) + '</p></div><div><p class="mini-tit">Lo que recomendamos</p><p>' + esc(o.propuesta) + '</p></div></div>';
  if (o.como_funciona) h += '<p class="mini-tit">Cómo funciona</p><p>' + esc(o.como_funciona) + '</p>';
  const ad = antesDespues(o);
  if (ad) h += '<p class="mini-tit" style="margin-top:26px">Antes y después</p>' + ad;
  h += '<p class="mini-tit" style="margin-top:28px">Ahorro estimado</p>' + ahorroHTML(o);
  h += '<div class="rejilla r2" style="margin-top:30px;gap:30px">';
  if (arr(o.herramientas).length) h += '<div><p class="mini-tit">Herramientas posibles</p><div class="herr">' + arr(o.herramientas).map(x => '<div><b>' + esc(x.nombre) + '</b><span class="tipo t-' + esc(x.tipo) + '">' + esc(HERR_TIPO[x.tipo] || '') + '</span>' + (x.nota ? '<span class="nota">' + esc(x.nota) + '</span>' : '') + '</div>').join('') + '</div></div>';
  if (arr(o.beneficios).length) h += '<div><p class="mini-tit">Además de las horas</p><ul class="lista-sobria">' + arr(o.beneficios).map(b => '<li>' + esc(b) + '</li>').join('') + '</ul></div>';
  h += '</div>';
  h += '<div class="rejilla r2" style="margin-top:30px;gap:30px">';
  if (arr(o.que_necesitamos).length) h += '<div><p class="mini-tit">Para implementarla necesitaríamos</p><ul class="lista-sobria">' + arr(o.que_necesitamos).map(b => '<li>' + esc(b) + '</li>').join('') + '</ul></div>';
  h += '<div><p class="mini-tit">Impacto y dificultad</p><div style="display:grid;gap:10px"><div><span style="display:inline-block;width:92px">Impacto</span>' + medidor(o.impacto) + ' <span class="suave chico">' + esc(o.impacto_motivo || '') + '</span></div><div><span style="display:inline-block;width:92px">Dificultad</span>' + medidor(o.dificultad, 'dif') + ' <span class="suave chico">' + esc(o.dificultad_motivo || '') + '</span></div></div></div>';
  h += '</div>';
  const dep = arr(o.depende_de).filter(id => OP[id]);
  if (dep.length) h += '<p class="chico suave" style="margin-top:22px">Conviene hacerla después de: ' + dep.map(id => '<b style="color:var(--texto)">' + esc(OP[id].titulo) + '</b>').join(' y ') + '.</p>';
  const r = PORP[o.id];
  if (r && r.nota) h += '<div class="cuidado-nota ' + (r.recomendacion === 'lista' ? 'lista' : '') + '"><span class="sem ' + (r.recomendacion === 'lista' ? 'verde' : r.recomendacion === 'no_recomendada' ? 'rojo' : 'amarillo') + '" style="margin-top:6px"></span><span>' + esc(r.nota) + '</span></div>';
  if (MES_DE[o.id]) h += '<p class="chico suave" style="margin-top:14px">En el plan: <b style="color:var(--texto)">mes ' + MES_DE[o.id] + '</b>.</p>';
  return h;
}

/* ---------- diagrama BPMN ---------- */
function envolver(txt, max, lineas) {
  const pal = String(txt || '').split(/\s+/); let out = [], cur = '';
  pal.forEach(w => { if (!cur) cur = w; else if ((cur + ' ' + w).length <= max) cur += ' ' + w; else { out.push(cur); cur = w; } });
  if (cur) out.push(cur);
  if (out.length > lineas) { out = out.slice(0, lineas); out[lineas - 1] = out[lineas - 1].replace(/.{0,2}$/, '') + '…'; }
  return out;
}
function tspans(lines, x, y0, lh) { return lines.map((l, i) => '<tspan x="' + x + '" y="' + (y0 + i * lh) + '">' + esc(l) + '</tspan>').join(''); }
function bpmnSVG(t, uid) {
  const pasos = arr(t.pasos).slice().sort((a, b) => a.orden - b.orden);
  const roles = [];
  arr(t.roles).concat(pasos.map(p => p.quien)).forEach(r => { if (r && roles.indexOf(r) < 0) roles.push(r); });
  if (!roles.length) roles.push('');
  const LH = 160, HW = 140, CW = 200, PADX = 24, n = pasos.length;
  const W = HW + PADX * 2 + (n + 2) * CW - 60, H = roles.length * LH;
  const laneY = q => { const i = roles.indexOf(q); return (i < 0 ? 0 : i) * LH + LH / 2 - 12; };
  const colX = c => HW + PADX + c * CW + CW / 2 - 30;
  const nodos = [{ k: 'inicio', x: colX(0), y: laneY(pasos[0] ? pasos[0].quien : roles[0]), hw: 20 }];
  pasos.forEach((s, i) => nodos.push({ k: s.tipo || 'tarea', s, x: colX(i + 1), y: laneY(s.quien), hw: s.tipo === 'decision' ? 40 : s.tipo === 'espera' ? 27 : 80 }));
  nodos.push({ k: 'fin', x: colX(n + 1), y: laneY(pasos.length ? pasos[pasos.length - 1].quien : roles[0]), hw: 20 });
  let g = '';
  roles.forEach((r, i) => {
    const y = i * LH;
    g += '<rect x="0" y="' + y + '" width="' + W + '" height="' + LH + '" fill="' + (i % 2 ? '#F7F2E8' : '#FCFAF5') + '"/>';
    g += '<rect x="0" y="' + y + '" width="' + HW + '" height="' + LH + '" fill="#EAE3D4"/>';
    g += '<line x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="#D8D0C0"/>';
    const lines = envolver(nombrePuesto(r) || r || 'Sin asignar', 16, 4);
    g += '<text font-size="13.5" font-weight="600" fill="#1F1E1C" text-anchor="middle">' + tspans(lines, HW / 2, y + LH / 2 - (lines.length - 1) * 9 + 5, 18) + '</text>';
  });
  g += '<line x1="' + HW + '" x2="' + HW + '" y1="0" y2="' + H + '" stroke="#D8D0C0"/><rect x="0.5" y="0.5" width="' + (W - 1) + '" height="' + (H - 1) + '" fill="none" stroke="#D8D0C0" rx="2"/>';
  for (let i = 0; i < nodos.length - 1; i++) {
    const a = nodos[i], b = nodos[i + 1];
    const sx = a.x + a.hw, sy = a.y, tx = b.x - b.hw - 3, ty = b.y;
    let d;
    if (Math.abs(sy - ty) < 1) d = 'M' + sx + ' ' + sy + ' H' + tx;
    else { const mx = Math.round((sx + b.x - b.hw) / 2); d = 'M' + sx + ' ' + sy + ' H' + mx + ' V' + ty + ' H' + tx; }
    g += '<path d="' + d + '" fill="none" stroke="#6B665E" stroke-width="1.6" marker-end="url(#fl-' + uid + ')" stroke-linejoin="round"/>';
    if (a.k === 'decision') g += '<text x="' + (sx + 8) + '" y="' + (sy - 7) + '" font-size="11.5" fill="#6B665E" font-weight="600">sí</text>';
  }
  nodos.forEach(nd => {
    const x = nd.x, y = nd.y, s = nd.s;
    if (nd.k === 'inicio' || nd.k === 'fin') {
      const et = nd.k === 'inicio' ? (t.disparador || 'Inicio') : (t.resultado || 'Fin');
      g += '<g aria-hidden="true"><circle cx="' + x + '" cy="' + y + '" r="20" fill="' + (nd.k === 'inicio' ? '#FFFFFF' : '#F0D9CC') + '" stroke="' + (nd.k === 'inicio' ? '#4F8A5B' : '#1F1E1C') + '" stroke-width="' + (nd.k === 'inicio' ? 2 : 4.5) + '"/>';
      g += '<text font-size="10.5" fill="#6B665E" text-anchor="middle" font-weight="700" letter-spacing=".06em">' + tspans([nd.k === 'inicio' ? 'INICIO' : 'FIN'], x, y + 38, 13) + '</text>';
      g += '<text font-size="12" fill="#1F1E1C" text-anchor="middle">' + tspans(envolver(et, 22, 3), x, y + 54, 14.5) + '</text></g>';
      return;
    }
    const minPC = s.tipo !== 'espera' && esPC(s.minutos);
    const minTxt = s.tipo === 'espera' ? 'espera' : minPC ? 'por confirmar' : fmtN(s.minutos.valor, 0) + ' min';
    const lbl = 'Paso ' + s.orden + ': ' + s.descripcion + '. ' + (s.quien_nombre || nombrePuesto(s.quien)) + '. ' + minTxt;
    g += '<g class="nodo" tabindex="0" role="button" aria-label="' + esc(lbl) + '" data-paso="' + esc(s.id) + '">';
    if (nd.k === 'decision') {
      g += '<path class="forma" d="M' + x + ' ' + (y - 40) + ' L' + (x + 40) + ' ' + y + ' L' + x + ' ' + (y + 40) + ' L' + (x - 40) + ' ' + y + ' Z" fill="#FFFFFF" stroke="#9A9284" stroke-width="1.6" stroke-linejoin="round"/>';
      g += '<text x="' + x + '" y="' + (y + 7) + '" text-anchor="middle" font-size="20" font-weight="700" fill="#C96442">?</text>';
      g += '<text font-size="12" fill="#1F1E1C" text-anchor="middle">' + tspans(envolver(s.descripcion, 26, 3), x, y + 58, 14.5) + '</text>';
      g += insignia(x, y - 54, minTxt, minPC, s.orden);
    } else if (nd.k === 'espera') {
      g += '<circle class="forma" cx="' + x + '" cy="' + y + '" r="27" fill="#FFFFFF" stroke="#9A9284" stroke-width="1.6"/><circle cx="' + x + '" cy="' + y + '" r="22" fill="none" stroke="#9A9284" stroke-width="1.3"/>';
      g += '<path d="M' + x + ' ' + (y - 11) + ' V' + y + ' L' + (x + 8) + ' ' + (y + 5) + '" fill="none" stroke="#C96442" stroke-width="2" stroke-linecap="round"/>';
      g += '<text font-size="12" fill="#1F1E1C" text-anchor="middle">' + tspans(envolver(s.descripcion, 26, 3), x, y + 46, 14.5) + '</text>';
      g += insignia(x, y - 42, minTxt, false, s.orden);
    } else {
      const tras = nd.k === 'traspaso';
      g += '<rect class="forma" x="' + (x - 80) + '" y="' + (y - 48) + '" width="160" height="96" rx="13" fill="' + (tras ? '#FBF3EE' : '#FFFFFF') + '" stroke="' + (tras ? '#C96442' : '#9A9284') + '" stroke-width="1.6"' + (tras ? ' stroke-dasharray="5 3"' : '') + '/>';
      g += '<text x="' + (x - 68) + '" y="' + (y - 28) + '" font-size="10.5" font-weight="700" fill="#C96442" letter-spacing=".05em">' + (tras ? 'TRASPASO' : 'PASO ' + s.orden) + '</text>';
      const ls = envolver(s.descripcion, 22, tras ? 2 : 3);
      g += '<text font-size="12.5" fill="#1F1E1C">' + tspans(ls, x - 68, y - 10, 15) + '</text>';
      if (tras && nombrePuesto(s.a_quien)) g += '<text font-size="11" fill="#8A3D22" font-weight="600">' + tspans(envolver('→ ' + nombrePuesto(s.a_quien), 26, 1), x - 68, y + 34, 13) + '</text>';
      const bw = minPC ? 92 : Math.max(46, minTxt.length * 7 + 14);
      g += '<rect x="' + (x + 80 - bw - 8) + '" y="' + (y - 41) + '" width="' + bw + '" height="18" rx="9" fill="' + (minPC ? '#ECE4F4' : '#F1EBDF') + '"/>';
      g += '<text x="' + (x + 80 - 8 - bw / 2) + '" y="' + (y - 28.5) + '" font-size="10.5" font-weight="700" fill="' + (minPC ? '#7A5AA6' : '#6B665E') + '" text-anchor="middle">' + esc(minTxt) + '</text>';
    }
    g += '</g>';
  });
  return '<svg viewBox="-12 -12 ' + (W + 24) + ' ' + (H + 24) + '" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Diagrama de la tarea ' + esc(t.nombre) + '" data-vw="' + (W + 24) + '" data-vh="' + (H + 24) + '"><defs><marker id="fl-' + uid + '" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B665E"/></marker></defs><g class="lienzo">' + g + '</g></svg>';
}
function insignia(x, y, t, pc, orden) {
  const w = pc ? 92 : Math.max(46, t.length * 7 + 14);
  return '<text x="' + (x - w / 2 + 2) + '" y="' + (y + 1) + '" font-size="10.5" font-weight="700" fill="#C96442" text-anchor="end" letter-spacing=".05em">' + orden + '</text>' +
    '<rect x="' + (x - w / 2 + 10) + '" y="' + (y - 12) + '" width="' + w + '" height="18" rx="9" fill="' + (pc ? '#ECE4F4' : '#F1EBDF') + '"/><text x="' + (x + 10) + '" y="' + (y + 1) + '" font-size="10.5" font-weight="700" fill="' + (pc ? '#7A5AA6' : '#6B665E') + '" text-anchor="middle">' + esc(t) + '</text>';
}
function visorHTML(t, uid) {
  return '<div class="bpmn"><div class="bpmn-vista" data-uid="' + uid + '">' + bpmnSVG(t, uid) +
    '<div class="bpmn-ctrl no-imp"><button type="button" data-z="in" aria-label="Acercar">+</button><button type="button" data-z="out" aria-label="Alejar">−</button><button type="button" data-z="fit" aria-label="Ver el diagrama completo" title="Ver completo"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button></div>' +
    '<span class="bpmn-ayuda no-imp">Arrastra para moverte · rueda o pellizco para acercar · toca un paso para ver el detalle</span></div></div>';
}

/* Zoom y arrastre */
const VISORES = [];
function escalaLegible() { return window.innerWidth <= 720 ? 0.72 : 0.88; }
function crearVisor(cont) {
  const svg = cont.querySelector('svg'), lienzo = svg.querySelector('.lienzo');
  let t = { x: 0, y: 0, k: 1 }, arrastre = null, pinza = null, movio = false;
  const punteros = new Map();
  const aplicar = () => lienzo.setAttribute('transform', 'translate(' + t.x + ' ' + t.y + ') scale(' + t.k + ')');
  const aSVG = (cx, cy) => { const m = svg.getScreenCTM(); if (!m) return { x: 0, y: 0 }; const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy; return pt.matrixTransform(m.inverse()); };

    out.push('<b>' + esc(top.nombre) + '</b> es el área que más horas lleva: ' + fmtN(top.horas_mes.valor, 0) + ' h por mes, el ' + fmtN(top.horas_mes.valor / tot * 100, 0) + ' % de todo lo relevado.');
  }
  const okD = d => d && (!esPC(d) || esParcial(d));
  if (F2 && okD(R2.horas_mes_liberables)) {
    out.push('Estimamos que se pueden liberar <b>' + esc(datoTexto(R2.horas_mes_liberables, 0)) + '</b>' + (okD(R2.personas_equivalentes) ? ', el tiempo de ' + esc(datoTexto(R2.personas_equivalentes, 1)) + ' de jornada completa' : '') + (esParcial(R2.horas_mes_liberables) ? ' (con algunos datos por confirmar en la reunión)' : '') + '.');
  }
  if (OPS.length) {
    const o = OPS[0], h = o.ahorro && o.ahorro.horas_mes;
    out.push('La recomendación de más impacto es <b>' + esc(o.titulo.charAt(0).toLowerCase() + o.titulo.slice(1)) + '</b>' + (h && !esPC(h) ? ': por sí sola libera ' + esc(datoTexto(h, 0)) + '.' : h && num(h.minimo) ? ': lo calculado hasta ahora es ' + esc('entre ' + fmtN(h.minimo, 0) + ' y ' + fmtN(h.maximo, 0) + ' h/mes') + ', y falta confirmar un dato para cerrar la cuenta.' : '.'));
    const rapidas = OPS.filter(x => x.impacto >= 3 && x.dificultad <= 2), ya = OPS.filter(x => arr(x.herramientas).some(hh => hh.tipo === 'ya_la_tienen'));
    if (rapidas.length) out.push('Hay <b>' + rapidas.length + ' ' + plural(rapidas.length, 'recomendación', 'recomendaciones') + ' de buen impacto y poca dificultad</b>' + (ya.length ? ', y ' + ya.length + ' se apoyan en herramientas que ya tienen' : '') + '. Por ahí proponemos empezar.');
  }
  if (!out.length) out.push('Todavía no tenemos datos suficientes para el resumen.');
  return out.slice(0, 4);
}

function matrizSVG() {
  const W = 720, Hh = 560, x0 = 70, x1 = 700, y0 = 24, y1 = 500;
  const sx = d => x0 + (d - 0.5) / 5 * (x1 - x0), sy = i => y1 - (i - 0.5) / 5 * (y1 - y0);
  const xm = sx(2.5), ym = sy(2.5);
  let g = '';
  g += '<rect x="' + x0 + '" y="' + y0 + '" width="' + (xm - x0) + '" height="' + (ym - y0) + '" fill="#E3EDE4" rx="10"/>';
  g += '<rect x="' + xm + '" y="' + y0 + '" width="' + (x1 - xm) + '" height="' + (ym - y0) + '" fill="#F3EDE2" rx="10"/>';
  g += '<rect x="' + x0 + '" y="' + ym + '" width="' + (xm - x0) + '" height="' + (y1 - ym) + '" fill="#F6F2EA" rx="10"/>';
  g += '<rect x="' + xm + '" y="' + ym + '" width="' + (x1 - xm) + '" height="' + (y1 - ym) + '" fill="#F8F5EF" rx="10"/>';
  const lab = (x, y, t, anchor, col) => '<text x="' + x + '" y="' + y + '" font-size="13" font-weight="700" fill="' + (col || '#6B665E') + '" text-anchor="' + anchor + '" letter-spacing=".03em">' + t + '</text>';
  g += lab(x0 + 14, y0 + 24, 'EMPEZAR POR ACÁ', 'start', '#2F5A39') + lab(x1 - 14, y0 + 24, 'PROYECTOS DE FONDO', 'end') + lab(x0 + 14, y1 - 14, 'MEJORAS SIMPLES', 'start') + lab(x1 - 14, y1 - 14, 'PARA MÁS ADELANTE', 'end');
  for (let i = 1; i <= 5; i++) { g += '<text x="' + sx(i) + '" y="' + (y1 + 22) + '" font-size="12" fill="#6B665E" text-anchor="middle">' + i + '</text><text x="' + (x0 - 14) + '" y="' + (sy(i) + 4) + '" font-size="12" fill="#6B665E" text-anchor="end">' + i + '</text>'; }
  g += '<text x="' + ((x0 + x1) / 2) + '" y="' + (y1 + 50) + '" font-size="13" font-weight="600" fill="#1F1E1C" text-anchor="middle">Dificultad →</text>';
  g += '<text transform="translate(20 ' + ((y0 + y1) / 2) + ') rotate(-90)" font-size="13" font-weight="600" fill="#1F1E1C" text-anchor="middle">Impacto →</text>';
  const celdas = {};
  OPS.forEach(o => { const k = (o.impacto || 1) + '-' + (o.dificultad || 1); (celdas[k] = celdas[k] || []).push(o); });
  const maxH = Math.max(1, ...OPS.map(o => o.ahorro && o.ahorro.horas_mes && num(o.ahorro.horas_mes.valor) ? o.ahorro.horas_mes.valor : 0));
  const pts = [];
  Object.keys(celdas).forEach(k => {
    const grupo = celdas[k], n = grupo.length;
    const cols = Math.ceil(Math.sqrt(n * 1.6)), filas = Math.ceil(n / cols);
    const pasoX = Math.min(40, (x1 - x0) / 5 / cols), pasoY = Math.min(36, (y1 - y0) / 5 / filas);
    grupo.forEach((o, i) => {
      const c = i % cols, f = Math.floor(i / cols), enFila = Math.min(cols, n - f * cols);
      const h = o.ahorro && o.ahorro.horas_mes && num(o.ahorro.horas_mes.valor) ? o.ahorro.horas_mes.valor : 0;
      const r = n > 1 ? Math.min(17, 11 + Math.sqrt(h / maxH) * 8) : 13 + Math.sqrt(h / maxH) * 13;
      pts.push({ o, x: sx(o.dificultad || 1) + (c - (enFila - 1) / 2) * pasoX, y: sy(o.impacto || 1) + (f - (filas - 1) / 2) * pasoY, r });
    });
  });
  pts.sort((a, b) => b.r - a.r).forEach(p => {
    const pc = esPC(p.o.ahorro && p.o.ahorro.horas_mes);
    g += '<g class="punto-op" tabindex="0" role="button" data-op="' + esc(p.o.id) + '" data-area="' + esc(p.o.area_id) + '" data-nivel="' + esc(p.o.nivel) + '" aria-label="Recomendación ' + p.o._n + ': ' + esc(p.o.titulo) + '"><title>' + p.o._n + '. ' + esc(p.o.titulo) + '</title>' +
      '<circle class="p" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + p.r.toFixed(1) + '" fill="' + colorArea(p.o.area_id) + '" fill-opacity=".88" stroke="#fff" stroke-width="2"' + (pc ? ' stroke-dasharray="4 3"' : '') + '/>' +
      '<text x="' + p.x.toFixed(1) + '" y="' + (p.y + 4.5).toFixed(1) + '" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" pointer-events="none">' + p.o._n + '</text></g>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="Matriz de impacto y dificultad de las recomendaciones">' + g + '</svg>';
}

  h += bloque('Todas las recomendaciones', 'Las ' + OPS.length + ' recomendaciones según su impacto y su dificultad. Toca un punto o un nombre para ver la ficha completa.', f + m);

  const b = F2 ? arr(F2.base_recomendada).slice(0, 5) : [];
  if (!b.length) return '';
  return '<section style="padding:0 0 var(--sep)"><div class="ancho"><div class="base rv"><div><span class="mini-tit">Base recomendada</span><h3>Cinco hábitos simples que ayudan a todo lo anterior</h3></div><ol>' + b.map(x => '<li>' + esc(x.texto) + '</li>').join('') + '</ol></div></div></section>';
}
function renderPie() {
  return '<footer class="pie"><div class="ancho pie-int"><span><img src="' + esc(DATOS.logo || '') + '" alt="">' + esc(MARCA.servicio || '') + ' · ' + esc(MARCA.consultor || '') + '</span><span>' + esc(EMP.nombre || '') + ' · ' + esc(fechaLarga(F1 && F1.generado)) + '</span></div></footer>';
}

/* ---------- armado e interacción ---------- */
document.getElementById('app').innerHTML = [
  seguro(renderPortada, 'portada'), seguro(renderResumen, 'resumen'), seguro(renderRecomendaciones, 'recomendaciones'),
  seguro(renderPlan, 'plan'), seguro(renderCuidados, 'cuidados'), seguro(renderReunion, 'reunión'), seguro(renderBase, 'base'), seguro(renderPie, 'pie'),
].join('');
document.getElementById('barra-logo').src = DATOS.logo || '';
document.getElementById('barra-emp').textContent = EMP.nombre || MARCA.servicio || '';
document.getElementById('barra-nav').innerHTML = SECCIONES.map(s => '<a href="#' + s[0] + '" data-sec="' + s[0] + '">' + esc(s[2]) + '</a>').join('');

document.addEventListener('click', e => {
  const b = e.target.closest('[data-op]');
  if (b && !b.closest('dialog')) { e.preventDefault(); abrirFicha(b.getAttribute('data-op')); }
});
document.addEventListener('keydown', e => {
  const p = e.target.closest && e.target.closest('.punto-op');
  if (p && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); abrirFicha(p.getAttribute('data-op')); }
});
const FILTRO = { area: '', nivel: '' };
document.querySelectorAll('.filtros').forEach(grp => grp.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  grp.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  FILTRO[grp.dataset.grupo] = b.dataset.v;
  const ok = el => (!FILTRO.area || el.dataset.area === FILTRO.area) && (!FILTRO.nivel || el.dataset.nivel === FILTRO.nivel);
  document.querySelectorAll('.punto-op').forEach(p => p.classList.toggle('apagado', !ok(p)));
  document.querySelectorAll('#lista-ops li').forEach(li => li.classList.toggle('oculto', !ok(li)));
}));
// barra superior y sección activa
(function () {
  const barra = document.getElementById('barra'), portada = document.getElementById('inicio');
  const links = Array.from(document.querySelectorAll('#barra-nav a'));
  const secs = SECCIONES.map(s => document.getElementById(s[0])).filter(Boolean);
  function act() {
    barra.classList.toggle('visible', !portada || portada.getBoundingClientRect().bottom < 80);
    let cur = ''; secs.forEach(s => { if (s.getBoundingClientRect().top < 140) cur = s.id; });
    links.forEach(a => a.classList.toggle('activo', a.dataset.sec === cur));
  }
  window.addEventListener('scroll', act, { passive: true }); act();
})();
activarAnclas();
activarTips();
activarReveal();
prepararImpresion();
</script>
