<!DOCTYPE html>
<html lang="es">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informe ejecutivo · Diagnóstico Inicial · Inmobiliaria del Centro</title>
<style>
/* ===== Diagnóstico Inicial v2 · estilos comunes (los incrusta montar-informe.mjs) ===== */
:root{
  --fondo:#F1EBDF;--tarjeta:#FBF8F1;--alterno:#EAE3D4;--texto:#1F1E1C;--suave:#6B665E;--linea:#D8D0C0;
  --acento:#C96442;--acento-suave:#F0D9CC;--pc:#7A5AA6;--pc-suave:#ECE4F4;--verde:#4F8A5B;--amarillo:#D9A21B;--rojo:#C0473A;
  --serif:Fraunces,'Iowan Old Style',Georgia,'Times New Roman',serif;--sans:Inter,'Segoe UI',system-ui,-apple-system,sans-serif;
  --r:18px;--r-s:12px;--ease:cubic-bezier(.22,.61,.36,1);
  --sombra:0 1px 2px rgba(31,30,28,.04),0 6px 22px rgba(31,30,28,.05);
  --sombra-alta:0 2px 6px rgba(31,30,28,.06),0 18px 48px rgba(31,30,28,.12);
  --sep:clamp(80px,9vw,120px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--sans);font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,svg{max-width:100%}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.15;margin:0;letter-spacing:-.01em;color:var(--texto)}
p{margin:0 0 1em}
a{color:inherit}
button{font:inherit;color:inherit}
b,strong{font-weight:650}
:focus-visible{outline:2.5px solid var(--acento);outline-offset:3px;border-radius:6px}
.suave{color:var(--suave)}
.chico{font-size:.86rem}
.mini{font-size:.78rem}
.num{font-variant-numeric:tabular-nums}
.oculto-vis{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- contenedores ---- */
.ancho{max-width:1160px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}
.angosto{max-width:820px}
.tarjeta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--sombra)}
.pad{padding:clamp(22px,3vw,34px)}
.rejilla{display:grid;gap:28px}
.r2{grid-template-columns:repeat(2,minmax(0,1fr))}
.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.r3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.r2,.r3{grid-template-columns:1fr}}

/* ---- jerarquía: sección y bloque ---- */
.seccion{padding:var(--sep) 0;position:relative}
.seccion + .seccion{border-top:1px solid var(--linea)}
.sec-cab{display:grid;grid-template-columns:auto 1fr;gap:6px 28px;align-items:end;margin-bottom:clamp(36px,5vw,56px)}
.sec-num{font-family:var(--serif);font-size:clamp(3.2rem,6vw,4.6rem);line-height:.85;color:var(--acento);font-weight:400;grid-row:span 2}
.sec-eti{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.sec-tit{font-size:clamp(2rem,4vw,3rem)}
.sec-baj{grid-column:1/-1;max-width:720px;color:var(--suave);font-size:1.08rem;margin:14px 0 0}
@media (max-width:640px){.sec-cab{grid-template-columns:1fr}.sec-num{grid-row:auto}}
.bloque{margin-top:clamp(48px,6vw,72px)}
.bloque:first-child{margin-top:0}
.blq-tit{font-size:clamp(1.35rem,2.3vw,1.7rem);margin-bottom:8px;display:flex;align-items:center;gap:12px}
.blq-tit::before{content:"";width:22px;height:2px;background:var(--acento);flex:none}
.blq-baj{color:var(--suave);margin:0 0 26px;max-width:720px}
.mini-tit{font-family:var(--sans);font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 10px}
.separador{height:1px;background:var(--linea);border:0;margin:40px 0}

/* ---- chips, etiquetas y estados ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--linea);background:#fff;border-radius:999px;padding:3px 12px;font-size:.83rem;line-height:1.5;white-space:nowrap}
.chip .pto{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.chip-area{font-weight:600}
.chip-nivel{background:var(--alterno);border-color:transparent;font-weight:600}
.chip-nivel.n-ia{background:#E7E0F0;color:#4F3A70}
.chip-nivel.n-automatizar{background:var(--acento-suave);color:#8A3D22}
.chip-nivel.n-optimizar{background:#DCE8DD;color:#2F5A39}
.chip-idea{background:transparent;border:1px dashed #B9AE9A;color:var(--suave);font-style:italic}
.est{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--suave);background:var(--alterno);border-radius:6px;padding:1px 7px;vertical-align:.12em;margin-left:6px}
.pc{display:inline-flex;align-items:center;gap:6px;color:var(--pc);background:var(--pc-suave);border-radius:999px;padding:1px 10px;font-size:.82rem;font-weight:600;white-space:nowrap}
.pc-parcial{display:inline-block;color:var(--pc);font-size:.74rem;font-weight:600;letter-spacing:.01em;border-bottom:1px dashed var(--pc);line-height:1.3;white-space:nowrap;cursor:help}
.pc::before{content:"?";display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1.5px solid currentColor;font-size:.66rem;font-weight:800}
.dato-motivo{display:block;color:var(--suave);font-size:.82rem;margin-top:4px}

/* ---- botones y desplegables ---- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--linea);background:var(--tarjeta);border-radius:999px;padding:8px 16px;font-size:.88rem;font-weight:550;cursor:pointer;text-decoration:none;transition:background .2s var(--ease),border-color .2s var(--ease),transform .2s var(--ease)}
.btn:hover{background:#fff;border-color:#C5BBA8}
.btn-acento{background:var(--acento);border-color:var(--acento);color:#fff}
.btn-acento:hover{background:#B5583A;border-color:#B5583A}
details.desp{border-top:1px solid var(--linea)}
details.desp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px;font-weight:600;font-size:.94rem}
details.desp>summary::-webkit-details-marker{display:none}
details.desp>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--suave);border-bottom:2px solid var(--suave);transform:rotate(45deg) translateY(-3px);transition:transform .25s var(--ease);flex:none}
details.desp[open]>summary::after{transform:rotate(-135deg) translateY(-1px)}
details.desp>.desp-cuerpo{padding:2px 2px 18px}
details.cuenta{margin-top:8px;font-size:.85rem}
details.cuenta>summary{cursor:pointer;color:var(--suave);font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:6px}
details.cuenta>summary::-webkit-details-marker{display:none}
details.cuenta>summary::before{content:"+";display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--linea);font-size:.75rem;line-height:1}
details.cuenta[open]>summary::before{content:"–"}
details.cuenta .cuenta-txt{margin-top:8px;background:var(--alterno);border-radius:10px;padding:10px 13px;color:var(--texto);font-variant-numeric:tabular-nums;line-height:1.55}
.cuenta-txt li{margin:2px 0}

/* ---- citas ---- */
.cita{margin:0;padding:16px 20px;border-left:3px solid var(--acento);background:var(--tarjeta);border-radius:0 var(--r-s) var(--r-s) 0;font-family:var(--serif);font-size:1.06rem;line-height:1.55}
.cita .quien{display:block;font-family:var(--sans);font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--suave);margin-bottom:6px}

/* ---- medidor 1..5 ---- */
.medidor{display:inline-flex;gap:3px;vertical-align:middle}
.medidor i{width:14px;height:6px;border-radius:3px;background:var(--linea)}
.medidor i.on{background:var(--acento)}
.medidor.dif i.on{background:var(--texto)}

/* ---- antes y después ---- */
.ad{display:grid;grid-template-columns:1fr 54px 1fr;gap:0;align-items:stretch}
.ad-col{background:#fff;border:1px solid var(--linea);border-radius:var(--r-s);padding:18px 18px 14px}
.ad-col.despues{background:#FCFAF4;border-color:#D9CDB8}
.ad-cab{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.ad-flecha{display:grid;place-items:center;color:var(--acento)}
.ad ol{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.ad li{display:grid;grid-template-columns:22px 1fr;gap:9px;font-size:.9rem;line-height:1.42;align-items:start}
.ad li .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;background:var(--alterno);color:var(--suave);margin-top:-1px}
.ad li.elimina .txt{text-decoration:line-through;text-decoration-color:var(--rojo);text-decoration-thickness:1.5px;color:var(--suave)}
.ad li.elimina .ic{background:#F4DCD8;color:var(--rojo)}
.ad li.reduce .ic{background:var(--acento-suave);color:#8A3D22}
.ad li.igual .txt{color:var(--suave)}
.ad li.nuevo .ic{background:#DCE8DD;color:var(--verde)}
.ad li .det{display:block;font-size:.78rem;color:var(--suave);margin-top:1px}
.ad li.tarea-sep{display:block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--suave);margin-top:6px}
.ad-ley{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:.78rem;color:var(--suave)}
.ad-ley span{display:inline-flex;align-items:center;gap:6px}
.ad-ley i{width:10px;height:10px;border-radius:50%;display:inline-block}
@media (max-width:720px){.ad{grid-template-columns:1fr}.ad-flecha{height:36px;transform:rotate(90deg)}}

/* ---- ficha de recomendación ---- */
.ficha-cab{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.ficha-tit{font-size:clamp(1.5rem,2.6vw,2rem);margin:0 0 12px}
.ficha-par{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:22px 0}
.ficha-par p{margin:0}
@media (max-width:720px){.ficha-par{grid-template-columns:1fr;gap:18px}}
.ahorro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:8px 0 0}
.ahorro-it{background:var(--alterno);border-radius:var(--r-s);padding:16px 18px}
.ahorro-it .et{font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}
.ahorro-it .v{font-family:var(--serif);font-size:1.32rem;line-height:1.2;margin-top:6px;font-variant-numeric:tabular-nums}
@media (max-width:720px){.ahorro{grid-template-columns:1fr}}
.lista-sobria{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lista-sobria li{position:relative;padding-left:20px;line-height:1.5}
.lista-sobria li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--acento)}
.herr{display:grid;gap:10px}
.herr div{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.herr b{font-weight:600}
.herr .tipo{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:1px 8px;background:var(--alterno);color:var(--suave);justify-self:start}
.herr .tipo.t-ya_la_tienen{background:#DCE8DD;color:#2F5A39}
.herr .nota{grid-column:1/-1;font-size:.86rem;color:var(--suave)}
.cuidado-nota{display:flex;gap:12px;align-items:flex-start;background:#FFF8E6;border:1px solid #EBD9A6;border-radius:var(--r-s);padding:12px 16px;font-size:.92rem;margin-top:18px}
.cuidado-nota.lista{background:#EEF5EF;border-color:#C9DDCC}

/* ---- visor BPMN ---- */
.bpmn{border-radius:var(--r);border:1px solid var(--linea);background:#fff;overflow:hidden;position:relative}
.bpmn-vista{position:relative;height:440px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;background-image:radial-gradient(rgba(107,102,94,.13) 1px,transparent 1px);background-size:18px 18px}
.bpmn-vista.arrastrando{cursor:grabbing}
.bpmn-vista svg{width:100%;height:100%;display:block}
.bpmn-ctrl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.bpmn-ctrl button{width:38px;height:38px;border-radius:11px;border:1px solid var(--linea);background:rgba(251,248,241,.96);cursor:pointer;display:grid;place-items:center;box-shadow:var(--sombra);transition:background .2s;font-size:1.1rem;font-weight:600}
.bpmn-ctrl button:hover{background:#fff}
.bpmn-ayuda{position:absolute;left:12px;bottom:10px;font-size:.75rem;color:var(--suave);background:rgba(251,248,241,.94);padding:4px 11px;border-radius:999px;pointer-events:none}
.nodo{cursor:pointer}
.nodo .forma{transition:stroke .2s,fill .2s}
.nodo:hover .forma,.nodo:focus .forma,.nodo.activo .forma{stroke:var(--acento);stroke-width:2.4}
.nodo:focus{outline:none}
#tip{position:fixed;z-index:300;max-width:320px;background:var(--texto);color:#F6F1E7;border-radius:12px;padding:12px 14px;font-size:.85rem;line-height:1.45;box-shadow:var(--sombra-alta);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .16s var(--ease),transform .16s var(--ease)}
#tip.visible{opacity:1;transform:none}
#tip b{color:#fff}
#tip .t-et{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:#C9BFAE;margin-bottom:3px}
#tip .t-f{display:block;margin-top:5px;color:#DCD3C3}

/* ---- semáforo ---- */
.sem{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
.sem.verde{background:var(--verde)}.sem.amarillo{background:var(--amarillo)}.sem.rojo{background:var(--rojo)}.sem.sin_dato{background:transparent;border:2px dashed var(--pc)}

/* ---- diálogo ---- */
dialog.ficha-dlg{border:0;padding:0;border-radius:22px;max-width:min(920px,94vw);width:100%;max-height:90vh;background:var(--fondo);box-shadow:var(--sombra-alta);color:var(--texto)}
dialog.ficha-dlg::backdrop{background:rgba(31,30,28,.45)}
.dlg-int{padding:clamp(24px,4vw,44px);overflow:auto;max-height:90vh}
.cerrar{position:sticky;top:0;float:right;width:42px;height:42px;border-radius:50%;border:1px solid var(--linea);background:#fff;cursor:pointer;display:grid;place-items:center;font-size:1.2rem;z-index:2}

/* ---- pendiente ---- */
.pendiente{border:1.5px dashed var(--linea);border-radius:var(--r);padding:40px;text-align:center;color:var(--suave);background:rgba(251,248,241,.5)}
.pendiente h3{font-size:1.4rem;margin-bottom:6px;color:var(--texto)}

/* ---- animación de entrada (nunca deja contenido oculto) ---- */
html.anim .rv{opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
html.anim .rv.visto{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}html.anim .rv{opacity:1!important;transform:none!important;transition:none}*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ---- impresión ---- */
@page{size:A4;margin:14mm 12mm}
@media print{
  html,body{background:#fff!important;font-size:11pt}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .rv{opacity:1!important;transform:none!important}
  .no-imp,.bpmn-ctrl,.bpmn-ayuda,#tip,dialog{display:none!important}
  .seccion{padding:28px 0;break-before:page}
  .tarjeta,.ad,.ahorro-it,.bpmn,figure{break-inside:avoid}
  h2,h3,h4,.blq-tit,.blq-baj,.sec-cab,.mini-tit,.subtit,.m-sec-cab{break-after:avoid}
  .bpmn-vista{height:auto!important;background:none}
  .bpmn-vista svg{height:auto!important}
  details>summary::after,details>summary::before{display:none!important}
  a{text-decoration:none}
}


/* ===== Informe ejecutivo ===== */
.barra{position:fixed;top:0;left:0;right:0;z-index:60;background:rgba(241,235,223,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea);transform:translateY(-102%);transition:transform .35s var(--ease)}
.barra.visible{transform:none}
.barra-int{display:flex;align-items:center;gap:22px;height:64px}
.barra-marca{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.02rem;white-space:nowrap;text-decoration:none}
.barra-marca img{width:30px;height:30px}
.barra nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.barra nav::-webkit-scrollbar{display:none}
.barra nav a{text-decoration:none;font-size:.86rem;font-weight:550;color:var(--suave);padding:7px 13px;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s}
.barra nav a:hover{color:var(--texto);background:rgba(255,255,255,.6)}
.barra nav a.activo{color:var(--texto);background:#fff;box-shadow:var(--sombra)}
@media (max-width:760px){.barra-marca span{display:none}}

/* portada */
.portada{min-height:min(100vh,980px);min-height:min(100svh,980px);display:flex;flex-direction:column;justify-content:space-between;gap:48px;padding:34px clamp(22px,5vw,72px) 40px;position:relative;overflow:hidden;background:radial-gradient(1200px 700px at 85% 20%,#F6EFE3 0,transparent 60%),var(--fondo)}
.port-top{display:flex;justify-content:space-between;align-items:center;gap:20px;position:relative;z-index:1}
.port-logo{display:flex;align-items:center;gap:14px}
.port-logo img{width:52px;height:52px}
.port-logo b{display:block;font-family:var(--serif);font-weight:500;font-size:1.12rem}
.port-logo span{font-size:.86rem;color:var(--suave)}
.port-tipo{font-size:.76rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--suave);border:1px solid var(--linea);border-radius:999px;padding:7px 16px;background:rgba(251,248,241,.6)}
.port-centro{position:relative;z-index:1;max-width:900px}
.port-eti{font-size:.82rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--acento);margin-bottom:22px;display:flex;align-items:center;gap:14px}
.port-eti::before{content:"";width:40px;height:2px;background:var(--acento)}
.portada h1{font-size:clamp(3rem,8.4vw,7rem);line-height:.98;letter-spacing:-.025em;font-weight:400}
.port-rubro{font-family:var(--serif);font-size:clamp(1.2rem,2.2vw,1.6rem);color:var(--suave);margin-top:22px;font-style:italic}
.port-pie{position:relative;z-index:1;display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:end;border-top:1px solid var(--linea);padding-top:26px}
.port-meta{display:flex;flex-wrap:wrap;gap:16px 44px;margin:0}
.port-meta dt{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.port-meta dd{margin:4px 0 0;font-family:var(--serif);font-size:1.12rem}
.port-indice{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px 18px;list-style:none;margin:0;padding:0;counter-reset:i}
.port-indice a{text-decoration:none;font-size:.88rem;color:var(--suave);display:inline-flex;gap:8px;align-items:baseline}
.port-indice a:hover{color:var(--texto)}
.port-indice a span{font-family:var(--serif);color:var(--acento)}
.port-deco{position:absolute;right:-7vw;top:7%;width:min(46vw,600px);opacity:.95;pointer-events:none}
@media (max-width:860px){.port-pie{grid-template-columns:1fr}.port-indice{justify-content:flex-start}.port-deco{right:-30vw;top:auto;bottom:24%;width:110vw;opacity:.45}}

/* cifras */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:1fr}}
.kpi{padding:26px 26px 22px;display:flex;flex-direction:column;gap:6px;min-height:178px}
.kpi .k-et{font-size:.76rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}
.kpi .k-num{font-family:var(--serif);font-size:clamp(2rem,3.4vw,2.6rem);line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:auto}
.kpi .k-num small{font-size:.45em;letter-spacing:0;color:var(--suave);margin-left:4px}
.kpi .k-pie{font-size:.9rem;color:var(--suave);line-height:1.45}
.kpi.destacado{background:var(--texto);border-color:var(--texto);color:#F6F1E7}
.kpi.destacado .k-et,.kpi.destacado .k-pie{color:#CFC6B6}
.kpi.destacado .est{background:rgba(255,255,255,.12);color:#E8DFCF}
.kpi .pc{font-family:var(--sans);font-size:.9rem;letter-spacing:0}
.kpi details.cuenta>summary{color:inherit;opacity:.8}
.kpi.destacado details.cuenta .cuenta-txt{background:rgba(255,255,255,.08);color:#F6F1E7}

/* organigrama compacto */
.org{position:relative;padding-top:64px}
.org-raiz{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--texto);color:#F6F1E7;border-radius:999px;padding:9px 22px;font-family:var(--serif);font-size:1.02rem;white-space:nowrap;z-index:1}
.org-areas{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:18px;position:relative}
.org-areas::before{content:"";position:absolute;top:-26px;left:calc(50% / var(--n));right:calc(50% / var(--n));height:2px;background:var(--linea)}
.org-area{position:relative;background:var(--tarjeta);border:1px solid var(--linea);border-radius:16px;padding:20px 18px 18px;box-shadow:var(--sombra);border-top:4px solid var(--c)}
.org-area::before{content:"";position:absolute;top:-28px;left:50%;width:2px;height:24px;background:var(--linea)}
.org-area h4{font-size:1.12rem;line-height:1.2;min-height:2.4em}
.org-h{font-family:var(--serif);font-size:1.7rem;margin-top:10px;font-variant-numeric:tabular-nums;line-height:1.1}
.org-h small{font-family:var(--sans);font-size:.8rem;color:var(--suave);margin-left:3px}
.org-barra{height:6px;border-radius:3px;background:var(--alterno);margin:10px 0 12px;overflow:hidden}
.org-barra i{display:block;height:100%;background:var(--c);border-radius:3px}
.org-meta{font-size:.84rem;color:var(--suave)}
.org-sec{list-style:none;margin:12px 0 0;padding:12px 0 0;border-top:1px dashed var(--linea);font-size:.84rem;display:grid;gap:4px}
.org-sec li{display:flex;justify-content:space-between;gap:8px}
.org-sec li span:last-child{color:var(--suave);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:980px){.org{padding-top:0}.org-raiz{position:static;transform:none;display:inline-block;margin-bottom:20px}.org-areas{grid-template-columns:repeat(2,minmax(0,1fr))}.org-areas::before,.org-area::before{display:none}}
@media (max-width:560px){.org-areas{grid-template-columns:1fr}}

/* lo más importante */
.clave{background:var(--acento-suave);border-radius:24px;padding:clamp(28px,4vw,52px);display:grid;grid-template-columns:240px 1fr;gap:36px}
.clave h3{font-size:clamp(1.7rem,3vw,2.3rem)}
.clave ol{list-style:none;margin:0;padding:0;display:grid;gap:22px;counter-reset:c}
.clave li{counter-increment:c;display:grid;grid-template-columns:44px 1fr;gap:14px;font-family:var(--serif);font-size:clamp(1.08rem,1.7vw,1.26rem);line-height:1.5}
.clave li::before{content:counter(c,decimal-leading-zero);font-size:.85rem;font-family:var(--sans);font-weight:700;color:var(--acento);border-top:2px solid var(--acento);padding-top:6px;height:fit-content}
.clave li b{font-weight:600}
@media (max-width:820px){.clave{grid-template-columns:1fr;gap:22px}}

/* recomendaciones destacadas */
.reco{padding:0;overflow:hidden;margin-top:40px}
.reco:first-child{margin-top:0}
.reco-cab{display:grid;grid-template-columns:auto 1fr;gap:28px;padding:clamp(26px,4vw,44px) clamp(24px,4vw,44px) 0}
.reco-num{font-family:var(--serif);font-size:clamp(3.4rem,7vw,5.4rem);line-height:.8;color:var(--acento);font-weight:400}
.reco-tit{font-size:clamp(1.6rem,3vw,2.3rem);margin:12px 0 0}
.reco-cuerpo{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:40px;padding:30px clamp(24px,4vw,44px) 0}
.reco-ahorro{background:var(--alterno);border-radius:18px;padding:22px 24px;align-self:start}
.reco-ahorro .grande{font-family:var(--serif);font-size:1.75rem;line-height:1.1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.reco-ahorro .fila{border-top:1px solid var(--linea);margin-top:14px;padding-top:12px}
.reco-ad{padding:30px clamp(24px,4vw,44px) 0}
.reco-pie{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px;padding:30px clamp(24px,4vw,44px) clamp(26px,4vw,40px);margin-top:30px;border-top:1px solid var(--linea);background:rgba(234,227,212,.35)}
@media (max-width:900px){.reco-cuerpo{grid-template-columns:1fr}.reco-pie{grid-template-columns:1fr}}
@media (max-width:560px){.reco-cab{grid-template-columns:1fr;gap:8px}}

/* filtros y matriz */
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filtros .f-et{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin-right:6px;min-width:56px}
.filtros button{border:1px solid var(--linea);background:var(--tarjeta);border-radius:999px;padding:6px 14px;font-size:.86rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .2s var(--ease)}
.filtros button:hover{border-color:#BFB49F}
.filtros button[aria-pressed="true"]{background:var(--texto);border-color:var(--texto);color:#fff}
.filtros button .pto{width:9px;height:9px;border-radius:50%}
.matriz-caja{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;margin-top:26px}
@media (max-width:980px){.matriz-caja{grid-template-columns:1fr}}
.matriz svg{width:100%;height:auto;display:block}
.punto-op{cursor:pointer;transition:opacity .3s var(--ease)}
.punto-op circle.p{transition:transform .25s var(--ease);transform-box:fill-box;transform-origin:center}
.punto-op:hover circle.p,.punto-op:focus circle.p{transform:scale(1.12)}
.punto-op:focus{outline:none}
.punto-op:focus circle.p{stroke:#1F1E1C;stroke-width:2.5}
.punto-op.apagado{opacity:.1;pointer-events:none}
.lista-ops{list-style:none;margin:0;padding:0;max-height:560px;overflow:auto;border-radius:16px;border:1px solid var(--linea);background:var(--tarjeta)}
.lista-ops li+li{border-top:1px solid var(--linea)}
.lista-ops li.oculto{display:none}
.lista-ops button{display:grid;grid-template-columns:34px 1fr;gap:12px;width:100%;text-align:left;background:none;border:0;padding:13px 16px;cursor:pointer;transition:background .2s}
.lista-ops button:hover{background:#fff}
.lista-ops .n{font-family:var(--serif);font-size:1.15rem;color:var(--acento);line-height:1.3}
.lista-ops .t{font-weight:600;line-height:1.35;display:block}
.lista-ops .m{font-size:.8rem;color:var(--suave);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px}
.ley-mat{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.8rem;color:var(--suave);margin-top:14px}
.ley-mat span{display:inline-flex;align-items:center;gap:6px}
.ley-mat i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* plan */
.linea-t{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding-top:58px}
.linea-t::before{content:"";position:absolute;top:21px;left:calc(16.66% - 10px);right:calc(16.66% - 10px);height:2px;background:linear-gradient(90deg,var(--acento),#D9A58F)}
.mes{position:relative;display:flex;flex-direction:column}
.mes::before{content:attr(data-mes);position:absolute;top:-58px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:var(--acento);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:1.25rem;box-shadow:0 0 0 6px var(--fondo)}
.mes .tarjeta{padding:26px 24px 8px;flex:1;display:flex;flex-direction:column}
.mes h3{font-size:1.4rem;margin:4px 0 16px}
.mes-items{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:9px}
.mes-items li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:.93rem;line-height:1.4}
.mes-items .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:.7rem;font-weight:700;background:var(--acento-suave);color:#8A3D22}
.mes-items .ic.cuidado{background:#FFF1CF;color:#8A6500}
.mes-items button{background:none;border:0;padding:0;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--linea);text-underline-offset:3px}
.mes-items button:hover{text-decoration-color:var(--acento)}
.mes-res{font-size:.92rem;margin:0 0 14px;padding:12px 14px;background:var(--alterno);border-radius:12px}
.mes .desp{margin-top:auto}
.mes-ahorro{font-family:var(--serif);font-size:1.15rem}
@media (max-width:900px){.linea-t{grid-template-columns:1fr;padding-top:0;padding-left:64px}.linea-t::before{top:0;bottom:0;left:21px;right:auto;width:2px;height:auto}.mes::before{top:0;left:-64px;transform:none}}
.plan-total{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;margin-top:36px;padding:28px 32px;background:var(--texto);color:#F6F1E7;border-radius:20px}
.plan-total .v{font-family:var(--serif);font-size:clamp(1.5rem,3vw,2.1rem);text-align:right}
.plan-total .est{background:rgba(255,255,255,.12);color:#E8DFCF}
.plan-total .pc{background:rgba(236,228,244,.15);color:#E3D6F3}
.plan-total .dato-motivo{color:#CFC6B6}
@media (max-width:700px){.plan-total{grid-template-columns:1fr}.plan-total .v{text-align:left}}

/* cuidados */
.semaforo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.semaforo{grid-template-columns:1fr}}
.sem-it{display:flex;gap:12px;align-items:center;background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:14px 16px}
.sem-it .sem{width:14px;height:14px}
.sem-it b{display:block;font-weight:600;font-size:.95rem}
.sem-it span.e{font-size:.8rem;color:var(--suave)}
.previa{display:flex;flex-direction:column;gap:10px}
.previa h4{font-size:1.2rem;line-height:1.25}
.previa .esf{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}
.previa .para{margin-top:auto;padding-top:12px;border-top:1px dashed var(--linea);font-size:.84rem;color:var(--suave)}
.detalle-sem{display:grid;gap:0}

/* reunión */
.agenda{list-style:none;margin:0;padding:0;counter-reset:a;display:grid;gap:0}
.agenda>li{counter-increment:a;display:grid;grid-template-columns:70px 1fr;gap:20px;padding:24px 0;border-top:1px solid var(--linea)}
.agenda>li::before{content:counter(a,decimal-leading-zero);font-family:var(--serif);font-size:2rem;color:var(--acento);line-height:1}
.agenda h4{font-size:1.25rem;margin-bottom:6px}
.agenda p{margin:0;color:var(--suave)}
.confirmar{display:grid;gap:12px}
.conf-it{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:16px 18px;background:var(--tarjeta);border:1px solid var(--linea);border-left:3px solid var(--pc);border-radius:14px}
.conf-it .q{font-weight:600;line-height:1.4}
.conf-it .d{font-size:.84rem;color:var(--suave);margin-top:3px}
.conf-it .r{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.conf-it .r span{font-size:.84rem;background:var(--pc-suave);border-radius:10px;padding:4px 10px}
.conf-it .r b{color:var(--pc);margin-right:4px}
.conf-n{width:28px;height:28px;border-radius:50%;background:var(--pc-suave);color:var(--pc);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.cierre{margin-top:72px;background:var(--texto);color:#F6F1E7;border-radius:26px;padding:clamp(34px,5vw,64px);display:grid;grid-template-columns:1fr auto;gap:36px;align-items:center;position:relative;overflow:hidden}
.cierre h3{color:#fff;font-size:clamp(1.8rem,3.6vw,2.8rem);font-weight:400;max-width:720px}
.cierre p{color:#D4CBBB;margin:16px 0 0;max-width:640px}
.cierre img{width:110px;height:110px;opacity:.95}
@media (max-width:700px){.cierre{grid-template-columns:1fr}}
.base{background:var(--alterno);border-radius:20px;padding:28px 32px;display:grid;grid-template-columns:260px 1fr;gap:28px}

.base ol{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--texto)}

.pie{padding:48px 0 64px;color:var(--suave);font-size:.86rem;border-top:1px solid var(--linea)}
.pie-int{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.pie img{width:30px;height:30px;vertical-align:middle;margin-right:8px}

@media print{

}

ng las transferencias del día» quedó con 5 minutos por cada uno de los unos 400 cobros del mes (33 h/mes). ¿Esos 5 minutos son por cada transferencia o una vez por día?","respuestas":[],"origen":"skill"}],"resumen":{"areas":6,"sectores":12,"puestos":12,"tareas":49,"tareas_relevadas":13,"horas_mes_totales":{"valor":881.6,"minimo":null,"maximo":null,"unidad":"horas/mes","cuenta":"Administración de alquileres: 355,1 h (parcial) + Comercial: 351,9 h (parcial) + Recepción: 99,8 h + Publicaciones y marketing: 41 h + Legales y contratos: 12,6 h + Dirección: 21,2 h = 881,6 h/mes","estado":"por_confirmar","motivo":"Faltan datos en 2 de 6 áreas; lo confirmado suma 881,6 h/mes","respuestas":[]},"costo_mes_total":{"valor":4078040,"minimo":null,"maximo":null,"unidad":"ARS/mes","cuenta":"Administración de alquileres: $ 2.030.530 (parcial) + Comercial: $ 1.500.106 (parcial) + Recepción: $ 547.404 = $ 4.078.040/mes (sin contar 3 datos por confirmar)","estado":"por_confirmar","motivo":"Faltan datos en 5 de 6 áreas; lo confirmado suma $ 4.078.040/mes","respuestas":[]},"personas_totales":{"valor":13,"minimo":null,"maximo":null,"unidad":"personas","cuenta":"Administración de alquileres: 4 (parcial) + Comercial: 5 + Recepción: 1 + Publicaciones y marketing: 1 + Legales y contratos: 1 + Dirección: 1 = 13 personas","estado":"por_confirmar","motivo":"Faltan datos en 1 de 6 áreas; lo confirmado suma 13 personas","respuestas":[]},"por_confirmar":17}},"fase2":{"tipo":"fase2-oportunidades","version":"2.0","cliente":"practica-inmobiliaria-del-centro","generado":"2026-11-23T19:18:39.962Z","hallazgos":[{"id":"h-01","patron":"pat-conciliacion-manual","tarea_id":"t-cobrar-e-identificar-pagos","paso_ids":["t-cobrar-e-identificar-pagos-p1","t-cobrar-e-identificar-pagos-p2","t-cobrar-e-identificar-pagos-p3"],"descripcion":"El Responsable de administración de alquileres revisa el home banking y busca por importe en la planilla de quién es cada transferencia: unos 400 cobros por mes, 33 h/mes solo en revisar el banco. Muchas llegan sin referencia o desde la cuenta de un familiar y más o menos una de cada diez no se puede identificar sin pedir el comprobante."},{"id":"h-02","patron":"pat-picos-de-trabajo","tarea_id":"t-cobrar-e-identificar-pagos","paso_ids":["t-cobrar-e-identificar-pagos-p4","t-cobrar-e-identificar-pagos-p6"],"descripcion":"El 70 % de los cobros entra entre el día 1 y el 10 y el 80 % de las liquidaciones se hace entre el 10 y el 15. El Corredor titular dice que a principio de mes la oficina «se para», y quien cobra dice que esos diez días son «una locura»."},{"id":"h-03","patron":"pat-mensajes-repetitivos","tarea_id":"t-emitir-avisos-de-pago-o-recibos","paso_ids":["t-emitir-avisos-de-pago-o-recibos-p3"],"descripcion":"Cada fin de mes se mandan 400 avisos de pago por WhatsApp, uno por uno (4 h/mes), y aparte los recordatorios de pago (3 h/mes). Quien lo hace contó que siempre alguno sale con el importe viejo."},{"id":"h-04","patron":"pat-ajustes-por-indice","tarea_id":"t-calcular-actualizaciones-de-alquiler","paso_ids":["t-calcular-actualizaciones-de-alquiler-p1","t-calcular-actualizaciones-de-alquiler-p2","t-calcular-actualizaciones-de-alquiler-p3","t-calcular-actualizaciones-de-alquiler-p4"],"descripcion":"Entre 80 y 100 contratos actualizan por mes con tres índices distintos y periodicidades distintas; el Responsable de contratos busca el índice, calcula en una planilla propia y controla uno por uno: 19,5 h/mes. Un error de fórmula hizo cobrar de menos a varios inquilinos durante tres meses."},{"id":"h-05","patron":"pat-doble-carga","tarea_id":"t-dar-de-alta-el-contrato-en-administracion","paso_ids":["t-dar-de-alta-el-contrato-en-administracion-p1","t-dar-de-alta-el-contrato-en-administracion-p2","t-dar-de-alta-el-contrato-en-administracion-p3"],"descripcion":"El mismo contrato se carga tres veces (sistema, planilla de actualizaciones y planilla de liquidaciones), y a fin de mes los importes exportados del sistema se vuelven a corregir a mano con la planilla de contratos (1 h/mes)."},{"id":"h-06","patron":"pat-errores-de-carga","tarea_id":"t-redactar-contratos-de-alquiler","paso_ids":["t-redactar-contratos-de-alquiler-p1","t-redactar-contratos-de-alquiler-p2"],"descripcion":"Cada contrato se arma copiando uno parecido en Word (30 minutos por contrato, 6,5 h/mes) y a veces queda un dato del contrato anterior."},{"id":"h-07","patron":"pat-reportes-manuales","tarea_id":"t-liquidar-a-propietarios","paso_ids":["t-liquidar-a-propietarios-p1","t-liquidar-a-propietarios-p2","t-liquidar-a-propietarios-p3","t-liquidar-a-propietarios-p4","t-liquidar-a-propietarios-p5"],"descripcion":"El Liquidador arma a mano unas 300 liquidaciones por mes con datos que ya están en la planilla: 75 h/mes, la tarea más larga de la empresa. Cuando falta la factura de un arreglo, el propietario reclama el descuento."},{"id":"h-08","patron":"pat-aprobacion-cuello-de-botella","tarea_id":"t-transferir-a-propietarios","paso_ids":["t-transferir-a-propietarios-p2","t-transferir-a-propietarios-p3"],"descripcion":"Las unas 300 transferencias del mes se cargan en lotes de 20 o 30 y cada lote espera la autorización del Corredor titular desde su celular. Si está en una firma, los propietarios cobran uno o dos días más tarde y llaman a reclamar."},{"id":"h-09","patron":"pat-preguntas-repetidas","tarea_id":"t-responder-consultas-de-propietarios","paso_ids":[],"descripcion":"La Auxiliar de atención a propietarios contesta unas 15 consultas por día (33 h/mes) por WhatsApp y teléfono, sobre todo cuándo cobran y por qué les descontaron un arreglo, y manda aparte los comprobantes de gastos (5,3 h/mes)."},{"id":"h-10","patron":"pat-respuesta-lenta-a-clientes","tarea_id":"t-responder-consultas-de-alquiler","paso_ids":["t-responder-consultas-de-alquiler-p1","t-responder-consultas-de-alquiler-p2","t-responder-consultas-de-alquiler-p3"],"descripcion":"Los 2 asesores de alquileres contestan entre 30 y 40 consultas por día de los portales (115,5 h/mes con lo confirmado), casi siempre con el mismo texto. Las de la noche y el fin de semana esperan al otro día hábil y para el lunes muchas propiedades ya tienen otros interesados."},{"id":"h-11","patron":"pat-agenda-manual","tarea_id":"t-agendar-visitas-y-reuniones","paso_ids":["t-agendar-visitas-y-reuniones-p1","t-agendar-visitas-y-reuniones-p2","t-agendar-visitas-y-reuniones-p4"],"descripcion":"La agenda de visitas está en papel en el mostrador: la Recepcionista coordina 7 a 10 visitas por día (47 h/mes), los asesores llaman para saber qué tienen y una de cada cuatro visitas se cae porque el interesado no va y nadie avisa."},{"id":"h-12","patron":"pat-reclamos-sin-trazabilidad","tarea_id":"t-recibir-reclamos-de-inquilinos","paso_ids":["t-recibir-reclamos-de-inquilinos-p2","t-recibir-reclamos-de-inquilinos-p4"],"descripcion":"Unos 6 reclamos por día se anotan en un cuaderno que no muestra cuáles siguen abiertos; los inquilinos vuelven a escribir para preguntar. Las facturas de los gremios se pierden entre el WhatsApp y la carpeta y no se descuentan a tiempo."},{"id":"h-13","patron":"pat-aprobacion-cuello-de-botella","tarea_id":"t-analizar-garantias-e-ingresos-del-inquilino","paso_ids":["t-analizar-garantias-e-ingresos-del-inquilino-p5","t-analizar-garantias-e-ingresos-del-inquilino-p6"],"descripcion":"El propietario tarda en responder si acepta al inquilino (dos días en el último caso) y, si pasa de tres días, el interesado sigue buscando y se cae la operación. Con los arreglos pasa lo mismo: si el propietario no contesta en tres días, decide el Corredor titular."},{"id":"h-14","patron":"pat-documentos-dispersos","tarea_id":"t-analizar-garantias-e-ingresos-del-inquilino","paso_ids":["t-analizar-garantias-e-ingresos-del-inquilino-p1"],"descripcion":"Los recibos de sueldo y la documentación de garantes llegan por partes al WhatsApp de cada asesor y se juntan a mano. Ya se perdió el celular de un asesor con conversaciones de inquilinos y fotos de su documentación."},{"id":"h-15","patron":"pat-preguntas-repetidas","tarea_id":"t-atender-llamadas-y-mensajes","paso_ids":[],"descripcion":"La Recepcionista atiende unas 30 llamadas y mensajes por día (44 h/mes) y contesta muchas veces por día la misma pregunta: cuál es el alias para transferir el alquiler."},{"id":"h-16","patron":"pat-sin-informacion-competencia","tarea_id":"t-buscar-comparables-de-mercado","paso_ids":[],"descripcion":"El Tasador busca a mano comparables de mercado para unas 3 tasaciones por semana (13 h/mes) y después escribe el informe (9,7 h/mes); el Corredor titular revisa cada tasación antes de que salga."},{"id":"h-17","patron":"pat-doble-carga","tarea_id":"t-publicar-en-portales-inmobiliarios","paso_ids":[],"descripcion":"Cada propiedad nueva se publica por separado en los portales (8,7 h/mes) y en redes (9,7 h/mes), y los precios y estados se actualizan a mano una vez por semana (3,2 h/mes). El usuario del portal de avisos lo comparten cinco personas."},{"id":"h-18","patron":"pat-sin-indicadores","tarea_id":"t-revisar-resultados-de-alquileres-administrados","paso_ids":[],"descripcion":"Los números de la cartera (cobrado, atrasos, liquidaciones pendientes, reclamos abiertos, consultas por portal) están repartidos entre el sistema, dos planillas, un cuaderno y los WhatsApp. El Corredor titular quiere pasar de 400 a 500 contratos sin sumar gente."},{"id":"h-19","patron":"pat-tramites-repetitivos","tarea_id":"t-pedir-libres-deudas-de-impuestos-y-servicios","paso_ids":[],"descripcion":"El Responsable de documentación inmobiliaria pide informes de dominio, inhibición y libres deudas en distintas webs y organismos todas las semanas (6,4 h/mes) y arma a mano la carpeta para la escribanía (4 h/mes)."},{"id":"h-20","patron":"pat-cobranza-manual","tarea_id":"t-reclamar-alquileres-atrasados","paso_ids":[],"descripcion":"Los alquileres atrasados se reclaman a mano, unas 2 horas cada vez; en la entrevista nos dijeron una vez por semana y quien lo hace nos dijo tres veces por semana."}],"base_recomendada":[{"id":"b-01","texto":"Nombrar a una segunda persona que pueda autorizar transferencias a propietarios cuando el Corredor titular no está, con un tope por monto."},{"id":"b-02","texto":"Fijar un día y una hora de corte para liquidar y transferir, y avisarlo a los propietarios."},{"id":"b-03","texto":"Acordar con los propietarios, en el contrato de administración, un plazo de 48 horas para responder si aceptan un inquilino o un arreglo."},{"id":"b-04","texto":"Definir qué arreglos menores (por tipo y monto) se hacen sin consultar al propietario."}],"oportunidades":[{"id":"op-01","titulo":"Cada inquilino con su propio link o CVU de pago: cobros que se identifican solos","origen":"idea_consultor","idea_id":"i-7","solucion_id":"sol-conciliacion-automatica","nivel":"automatizar","area_id":"a-administracion","sector_id":"s-cobranza-de-alquileres","tarea_ids":["t-cobrar-e-identificar-pagos"],"hallazgos":["h-01","h-02","h-15"],"hoy":"El Responsable de administración de alquileres revisa el home banking todos los días (33 h/mes) y busca por importe de quién es cada una de las unas 400 transferencias; para identificar cada una nos dijeron 6 y 10 minutos. Más o menos una de cada diez llega sin poder identificarse y hay que pedir el comprobante por WhatsApp. La Recepcionista contesta muchas veces por día cuál es el alias.","propuesta":"Recomendamos darle a cada inquilino un medio de pago propio: un link o QR de Mercado Pago con el número de contrato, o un CVU por inquilino de un servicio de recaudación. Cada pago entra ya con nombre y contrato, se anota solo en la planilla de liquidaciones y a la persona le queda solo revisar y emitir el recibo.","como_funciona":"Una planilla en la nube tiene un renglón por contrato con su link o CVU. Cuando entra un pago, Mercado Pago o el servicio de recaudación manda un aviso automático (una notificación que lee una herramienta de integración como Make o n8n), que busca el contrato por la referencia, marca «cobrado» con fecha e importe y deja la lista lista para emitir los recibos. Lo que no coincide (pago parcial, importe distinto) queda marcado en otro color para revisar.","antes_despues":{"pasos_afectados":[{"paso_id":"t-cobrar-e-identificar-pagos-p1","efecto":"reduce","porcentaje_min":50,"porcentaje_max":80,"supuesto":"Los pagos con link o CVU propio aparecen ya identificados en la planilla; el home banking se mira solo para los que siguen transfiriendo a la cuenta general."},{"paso_id":"t-cobrar-e-identificar-pagos-p2","efecto":"reduce","porcentaje_min":50,"porcentaje_max":80,"supuesto":"Cada pago trae el número de contrato; queda buscar a mano solo los pagos que no usan el link o el CVU."},{"paso_id":"t-cobrar-e-identificar-pagos-p3","efecto":"reduce","porcentaje_min":60,"porcentaje_max":85,"supuesto":"Si el pago llega con su referencia, ya no hace falta pedir el comprobante; queda para los casos sueltos."},{"paso_id":"t-cobrar-e-identificar-pagos-p6","efecto":"reduce","porcentaje_min":60,"porcentaje_max":85,"supuesto":"La marca de cobrado en la planilla de liquidaciones la hace la automatización; la persona solo revisa los marcados en otro color."}],"pasos_nuevos":[{"descripcion":"El sistema de cobro avisa cada pago con su número de contrato","quien":"Sistema"},{"descripcion":"La automatización marca el cobro en la planilla de liquidaciones","quien":"Sistema"},{"descripcion":"Revisar los pagos marcados como diferentes y emitir los recibos del día","quien":"Responsable de administración de alquileres"}]},"herramientas":[{"nombre":"Mercado Pago (links de pago y QR con referencia)","tipo":"ya_la_tienen","nota":"Ya lo usan algunos inquilinos; se arma un link fijo por contrato."},{"nombre":"Servicio de recaudación con CVU por inquilino (del banco o de una plataforma de cobranzas)","tipo":"paga_o_gratuita","nota":"Para los inquilinos que prefieren seguir transfiriendo desde su banco."},{"nombre":"Make o n8n con Google Sheets","tipo":"paga_o_gratuita","nota":"Recibe el aviso de cada pago y lo anota en la planilla."}],"beneficios":["Los primeros diez días del mes dejan de depender de una o dos personas buscando transferencias","Ningún pago sin identificar ni inquilino al que se le pide el comprobante dos veces","Se acaba la pregunta «¿cuál es el alias?» en recepción","Base para liquidar a propietarios el mismo día del cobro"],"impacto":5,"impacto_motivo":"Estimamos entre 24,4 y 37,6 h/mes liberadas sin contar la identificación de cada transferencia, que está por confirmar. Resuelve el dolor principal que contaron (del 1 al 10 la oficina se para) y va al objetivo de cobrar más rápido sin sumar gente.","dificultad":3,"dificultad_motivo":"Mercado Pago ya lo tienen, pero conecta el medio de cobro con la planilla y depende de que los inquilinos empiecen a usar su link o CVU.","depende_de":[],"que_necesitamos":["Lista de contratos con número, inquilino e importe del mes","Acceso de administrador a la cuenta de Mercado Pago de la empresa","Consulta al banco por su servicio de recaudación con CVU o referencia","Un modelo de mensaje para avisar a los inquilinos del cambio"],"para_la_reunion":["¿Cuántos inquilinos pagan por transferencia, cuántos con Mercado Pago y cuántos en efectivo?","¿Cuántos minutos lleva identificar cada transferencia: 6 o 10?"],"ahorro":{"horas_mes":{"valor":31.1,"minimo":24.4,"maximo":37.6,"unidad":"horas/mes","cuenta":"Revisar en el home banking las transferencias del día (Cobrar e identificar pagos): 33 h × 50–80 % = 16,5–26,4 h; Identificar de qué inquilino es cada transferencia (Cobrar e identificar pagos): por confirmar (Dos personas dijeron tiempos distintos); Si no se puede identificar, pedir el comprobante al inquili… (Cobrar e identificar pagos): por confirmar (Paso condicional: falta saber en cuántas de cada 10 veces pasa (si pasara siempre serían 26,4 h/mes)); Marcar el cobro en la planilla de liquidaciones para el liq… (Cobrar e identificar pagos): 13,2 h × 60–85 % = 7,9–11,2 h. Total: 31,1 h/mes (entre 24,4 h y 37,6 h) id":"op-02","titulo":"Aviso de pago, recordatorios y reclamo de atrasos que salen solos por WhatsApp","origen":"idea_consultor","idea_id":"i-1","solucion_id":"sol-cobranza-alquileres-automatica","nivel":"automatizar","area_id":"a-administracion","sector_id":"s-cobranza-de-alquileres","tarea_ids":["t-emitir-avisos-de-pago-o-recibos","t-enviar-recordatorios-de-pago-por-whatsapp","t-reclamar-alquileres-atrasados"],"hallazgos":["h-03","h-20"],"hoy":"Cada fin de mes se mandan 400 avisos por WhatsApp uno por uno (4 h/mes) y siempre alguno sale con el importe viejo; los recordatorios de pago llevan otras 3 h/mes. Los atrasos se reclaman a mano, unas 2 horas cada vez (una o tres veces por semana, según quién lo cuenta).","propuesta":"Recomendamos que el aviso de cada mes salga solo, con el importe ya actualizado y el link de pago del inquilino, y que los recordatorios se manden solos antes del vencimiento y el día después, con el interés por mora calculado según el contrato. La persona solo atiende a quien contesta o sigue sin pagar.","como_funciona":"La planilla de contratos tiene el importe del mes, el vencimiento y el link de pago. Una automatización (Make o n8n) manda por la API de WhatsApp Business (la conexión oficial para enviar mensajes en cantidad sin que bloqueen el número) un mensaje con plantilla a cada inquilino: aviso el día 25, recordatorio el día del vencimiento y aviso de atraso al día siguiente, solo a los que no figuran como cobrados.","antes_despues":{"pasos_afectados":[{"paso_id":"t-emitir-avisos-de-pago-o-recibos-p3","efecto":"reduce","porcentaje_min":60,"porcentaje_max":85,"supuesto":"Los 400 avisos los manda la automatización; la persona revisa la lista antes del envío y responde a quien contesta."},{"paso_id":"t-enviar-recordatorios-de-pago-por-whatsapp","efecto":"reduce","porcentaje_min":60,"porcentaje_max":85,"supuesto":"Los recordatorios salen solos solo a quienes no pagaron; queda revisar respuestas."},{"paso_id":"t-reclamar-alquileres-atrasados","efecto":"reduce","porcentaje_min":30,"porcentaje_max":50,"supuesto":"Los primeros avisos de atraso salen solos con el interés calculado; las llamadas a quienes siguen sin pagar las sigue haciendo una persona."}],"pasos_nuevos":[{"descripcion":"La automatización manda aviso, recordatorio y aviso de atraso con el link de pago","quien":"Sistema"},{"descripcion":"Revisar la lista antes del envío y atender a quienes responden","quien":"Responsable de administración de alquileres"}]},"herramientas":[{"nombre":"WhatsApp Business API con una herramienta de envíos (por ejemplo, Kommo, Botmaker o similar)","tipo":"paga","nota":"Plantillas de mensaje aprobadas por WhatsApp para enviar en cantidad sin bloquear el número."},{"nombre":"Make o n8n","tipo":"paga_o_gratuita","nota":"Lee la planilla y decide a quién le toca cada mensaje."},{"nombre":"Mercado Pago (link de pago del inquilino)","tipo":"ya_la_tienen","nota":"El link va dentro de cada mensaje."}],"beneficios":["Ningún aviso con el importe viejo","Se cobra antes y con menos atrasos","Trato parejo con todos los inquilinos","El reclamo de atrasos deja de depender de que alguien tenga tiempo"],"impacto":4,"impacto_motivo":"Estimamos entre 4,2 y 6 h/mes con lo confirmado (el reclamo de atrasos está por confirmar), pero resuelve una fricción que hace perder plata (avisos con el importe viejo) y va directo al objetivo de cobrar más rápido.","dificultad":3,"dificultad_motivo":"Herramienta nueva (WhatsApp Business API), conecta la planilla con WhatsApp y depende de que WhatsApp autorice las plantillas de mensaje.","depende_de":["op-01","op-03"],"que_necesitamos":["Número de WhatsApp de la empresa para cobranzas","Contacto de cada inquilino","La regla de interés por mora de los contratos","Textos de aviso, recordatorio y atraso que quieran usar"],"para_la_reunion":["¿Cuántos inquilinos se atrasan en un mes normal y qué interés por mora fijan los contratos?","¿Cada cuánto se reclaman hoy los atrasos: una o tres veces por semana? elo con los campos marcados, se da de alta en la base de contratos y se manda al inquilino el mensaje con sus datos de pago.","como_funciona":"Un formulario (Google Forms o una app hecha con AppSheet) carga la ficha en la base de contratos. Desde ahí, el modelo de contrato en Google Docs o Word se completa solo con los datos de la ficha (lo que en Word se llama combinar correspondencia), así no queda ningún dato del contrato anterior. La misma ficha alimenta la planilla de actualizaciones y la de liquidaciones, y prepara el mensaje de bienvenida con el link de pago.","antes_despues":{"pasos_afectados":[{"paso_id":"t-redactar-contratos-de-alquiler-p1","efecto":"reduce","porcentaje_min":60,"porcentaje_max":85,"supuesto":"El contrato sale del modelo con los datos de la ficha; queda revisar y ajustar las cláusulas especiales."},{"paso_id":"t-redactar-contratos-de-alquiler-p2","efecto":"elimina"},{"paso_id":"t-dar-de-alta-el-contrato-en-administracion-p2","efecto":"elimina"},{"paso_id":"t-dar-de-alta-el-contrato-en-administracion-p3","efecto":"elimina"},{"paso_id":"t-dar-de-alta-el-contrato-en-administracion-p4","efecto":"reduce","porcentaje_min":60,"porcentaje_max":85,"supuesto":"El mensaje con los datos de pago y el calendario sale armado desde la ficha; la persona lo revisa y lo manda."}],"pasos_nuevos":[{"descripcion":"Completar la ficha de la operación una sola vez al reservar","quien":"Asesor de alquileres"},{"descripcion":"El modelo de contrato se completa solo con los datos de la ficha","quien":"Sistema"}]},"herramientas":[{"nombre":"Word (combinar correspondencia) o Google Docs con un complemento de plantillas","tipo":"ya_la_tienen","nota":"El modelo de contrato con los campos marcados."},{"nombre":"Google Forms o AppSheet","tipo":"gratuita","nota":"Ficha única de la operación que carga la base de contratos."},{"nombre":"Google Sheets","tipo":"gratuita","nota":"La misma base de contratos que usa la actualización por índice."}],"beneficios":["Ningún contrato con ileres","tarea_ids":["t-responder-consultas-de-alquiler","t-responder-consultas-de-portales","t-hacer-seguimiento-de-interesados"],"hallazgos":["h-10"],"hoy":"Los 2 asesores de alquileres contestan entre 30 y 40 consultas por día hábil (115,5 h/mes con lo confirmado): leen la consulta, abren la ficha para ver si sigue disponible y responden casi siempre lo mismo (precio, mascotas, garantía, gastos de ingreso). Los asesores de ventas responden otras 20 por día (36,7 h/mes). Las consultas de la noche y del fin de semana esperan al otro día hábil y se pierden interesados.","propuesta":"Recomendamos que todas las consultas de los portales entren a un solo lugar y que un asistente con IA las conteste en el momento con los datos reales de la propiedad (disponible o no, precio, requisitos, mascotas, gastos de ingreso) y ofrezca el link para elegir horario de visita. Los asesores reciben la consulta ya respondida y se ocupan de los interesados que avanzan.","como_funciona":"Los avisos de consulta de los portales llegan por mail o WhatsApp; una automatización (Make o n8n) los toma, busca la propiedad en una base de fichas (planilla con estado, precio y requisitos de cada propiedad) y le pasa esos datos a un asistente con IA (Claude o ChatGPT en versión de empresa) que redacta la respuesta. Al principio los asesores revisan las respuestas antes de que salgan; con las preguntas más comunes ya controladas, el asistente responde solo y deriva a una persona lo que no sabe. Cada consulta queda registrada con su portal en un CRM (una lista de interesados con seguimiento).","antes_despues":{"pasos_afectados":[{"paso_id":"t-responder-consultas-de-alquiler-p1","efecto":"reduce","porcentaje_min":50,"porcentaje_max":80,"supuesto":"Las consultas de todos los portales llegan juntas y ya leídas por el asistente; el asesor ve un resumen."},{"paso_id":"t-responder-consultas-de-alquiler-p2","efecto":"reduce","porcentaje_min":60,"porcentaje_max":85,"supuesto":"El asistente consulta la base de uatro visitas se cae porque el interesado no va y nadie avisa.","propuesta":"Recomendamos una agenda compartida en el celular de cada asesor, con franjas disponibles por propiedad. El interesado elige el horario desde un link, recibe la confirmación y un recordatorio que tiene que confirmar unas horas antes; si no confirma, el turno se libera y se avisa al asesor. El inquilino que vive en la propiedad marca sus franjas por link una sola vez.","como_funciona":"Cada asesor tiene su calendario en Google Calendar con páginas de reserva (un link que muestra solo los horarios libres). Por cada propiedad se cargan las franjas que dio el inquilino actual. El interesado reserva desde el link que le manda el asistente o el asesor; la herramienta manda la confirmación y el recordatorio por mail o WhatsApp, y la visita aparece sola en el celular del asesor. Después de la visita se le pide al interesado una devolución corta que queda en la ficha.","antes_despues":{"pasos_afectados":[{"paso_id":"t-agendar-visitas-y-reuniones-p1","efecto":"elimina"},{"paso_id":"t-agendar-visitas-y-reuniones-p2","efecto":"reduce","porcentaje_min":30,"porcentaje_max":50,"supuesto":"El inquilino actual marca sus franjas por link; la Recepcionista llama solo a quien no contesta."},{"paso_id":"t-agendar-visitas-y-reuniones-p3","efecto":"reduce","porcentaje_min":60,"porcentaje_max":85,"supuesto":"La confirmación al interesado sale sola al reservar."},{"paso_id":"t-agendar-visitas-y-reuniones-p4","efecto":"elimina"},{"paso_id":"t-coordinar-visitas","efecto":"reduce","porcentaje_min":40,"porcentaje_max":70,"supuesto":"Los asesores de ventas usan la misma agenda con link de reserva."},{"paso_id":"t-mostrar-propiedades-en-alquiler-p2","efecto":"reduce","porcentaje_min":5,"porcentaje_max":10,"supuesto":"Hoy 1 de cada 4 visitas se pierde; con confirmación obligatoria y recordatorio estimamos evitar entre 2 y 4 de cada 10 de esas visitas perdidas, y con ellas el viaje."}],"pasos_nuevos":[{"descripcion":"El int ":30,"porcentaje_max":50,"supuesto":"Una parte de los reclamos entra directo por el formulario con los datos completos; el resto se sigue recibiendo por WhatsApp."},{"paso_id":"t-recibir-reclamos-de-inquilinos-p2","efecto":"reduce","porcentaje_min":50,"porcentaje_max":80,"supuesto":"El formulario pide las fotos al cargar el reclamo."},{"paso_id":"t-recibir-reclamos-de-inquilinos-p4","efecto":"elimina"},{"paso_id":"t-pedir-autorizacion-al-propietario-y-coordinar-el-arreglo-p1","efecto":"reduce","porcentaje_min":40,"porcentaje_max":70,"supuesto":"El presupuesto sale de la app con el botón para autorizar."},{"paso_id":"t-pedir-autorizacion-al-propietario-y-coordinar-el-arreglo-p5","efecto":"elimina"}],"pasos_nuevos":[{"descripcion":"El inquilino carga el reclamo con fotos y recibe su número","quien":"Cliente"},{"descripcion":"El propietario autoriza el presupuesto con un botón; si no contesta en 48 h, la app avisa","quien":"Sistema"},{"descripcion":"El gremio sube la foto de la factura y la app se la pasa al Liquidador","quien":"Sistema"}]},"herramientas":[{"nombre":"AppSheet sobre Google Sheets","tipo":"paga_o_gratuita","nota":"App sin programar, con formulario, estados y avisos."},{"nombre":"Google Forms + Sheets + Apps Script","tipo":"gratuita","nota":"Versión más simple si se quiere empezar con poco."},{"nombre":"HubSpot (tickets)","tipo":"gratuita","nota":"Alternativa con plan gratuito para reclamos con número."}],"beneficios":["Ningún reclamo perdido ni inquilino que vuelve a preguntar","Las facturas de los arreglos se descuentan a tiempo y el propietario no reclama","Se miden causas, tiempos y gremios","El propietario autoriza más rápido"],"impacto":4,"impacto_motivo":"Estimamos entre 16,1 y 21,1 h/mes entre recibir reclamos y pasar facturas; evita descuentos que se pierden y genera información de reclamos y gremios que hoy no existe.","dificultad":3,"dificultad_motivo":"Herramienta nueva, cambia la rutina del Coordinador y del Liquidador, y depende de que inqui ndamos que cada propietario reciba solo, en el mismo momento, la liquidación con el detalle de lo cobrado, cada descuento con la foto de su factura y el aviso de la transferencia. Además, una página propia por propietario donde ve sus liquidaciones del año. La Auxiliar sigue atendiendo en persona a quien quiere hablar: solo se van las preguntas de rutina.","como_funciona":"Con la liquidación automática y la app de reclamos, cada descuento ya tiene su factura guardada. El PDF de la liquidación incluye un link a esas facturas, y cuando el archivo de transferencias se procesa, una automatización manda por WhatsApp o mail «Te transferimos el alquiler de tal mes». Con Glide o AppSheet (apps sin programar) se arma una página de consulta donde cada propietario entra con su mail y ve solo lo suyo; el resumen anual sale de la misma base.","antes_despues":{"pasos_afectados":[{"paso_id":"t-responder-consultas-de-propietarios","efecto":"reduce","porcentaje_min":30,"porcentaje_max":50,"supuesto":"Estimamos que una parte de las consultas son de rutina (cuándo cobro, por qué me descontaron) y dejan de llegar porque la respuesta ya está en el resumen."},{"paso_id":"t-enviar-comprobantes-de-gastos-a-propietarios","efecto":"elimina"},{"paso_id":"t-transferir-a-propietarios-p4","efecto":"reduce","porcentaje_min":60,"porcentaje_max":85,"supuesto":"El aviso de transferencia sale solo; queda reenviar comprobantes cuando alguien los pide."},{"paso_id":"t-enviar-resumenes-anuales-a-propietarios","efecto":"reduce","porcentaje_min":60,"porcentaje_max":85,"supuesto":"El resumen anual sale de la misma base; queda revisarlo y enviarlo."}],"pasos_nuevos":[{"descripcion":"Mandar al propietario la liquidación con las facturas de los descuentos y el aviso de transferencia","quien":"Sistema"},{"descripcion":"Atender a los propietarios que quieren hablar","quien":"Auxiliar de atención a propietarios"}]},"herramientas":[{"nombre":"Google Sheets + Apps Script","tipo":"gratuita","nota":"Envío del resume /* ---------- utilidades ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function arr(x) { return Array.isArray(x) ? x : []; }

function fmtN(v, dec) {
  if (!num(v)) return '';

  const neg = v < 0; let s = Math.abs(v).toFixed(dec);
  let [e, d] = s.split('.');
  e = e.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  if (d && /^0+$/.test(d)) d = '';
  return (neg ? '−' : '') + e + (d ? ',' + d : '');
}
function fmtPesos(v, unidad) { return (/^USD/i.test(unidad || '') ? 'US$ ' : '$ ') + fmtN(Math.round(v), 0); }
function plural(n, a, b) { return n === 1 ? a : b; }
function listaY(xs) { xs = xs.filter(Boolean); return xs.length <= 1 ? (xs[0] || '') : xs.slice(0, -1).join(', ') + ' y ' + xs[xs.length - 1]; }
function mayus(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }
function fechaLarga(iso) {
  const d = iso ? new Date(iso) : new Date();
  if (isNaN(d)) return '';
  const m = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  return d.getUTCDate() + ' de ' + m[d.getUTCMonth()] + ' de ' + d.getUTCFullYear();
}

/* Valor con su unidad, en castellano. */
function valorUnidad(v, unidad, dec) {
  const u = unidad || '';
  if (/^(ARS|USD)\/mes/.test(u)) return fmtPesos(v, u) + ' por mes';
  if (/^(ARS|USD)\/hora/.test(u)) return fmtPesos(v, u) + ' por hora';
  if (/^(ARS|USD)/.test(u)) return fmtPesos(v, u);
  if (u === 'horas/mes') return fmtN(v, dec) + ' h/mes';
  if (u === 'horas/semana') return fmtN(v, 0) + ' h por semana';
  if (u === 'minutos') return fmtN(v, 0) + ' min';
  if (u === 'veces/mes') return fmtN(v, dec) + ' ' + plural(v, 'vez', 'veces') + ' por mes';
  if (u === 'personas') return fmtN(v, dec == null ? (Number.isInteger(v) ? 0 : 1) : dec) + ' ' + plural(v, 'persona', 'personas');
  return fmtN(v, dec) + (u ? ' ' + u : '');
}
function soloNumero(v, unidad, dec) {
  const u = unidad || '';
  if (/^(ARS|USD)/.test(u)) return fmtPesos(v, u);
  if (u === 'personas') return fmtN(v, dec == null ? (Number.isInteger(v) ? 0 : 1) : dec);
  return fmtN(v, dec);
}
function esPC(d) { return !d || d.estado === 'por_confirmar' || (!num(d.valor) && !(num(d.minimo) && num(d.maximo))); }
function esRango(d) { return d && num(d.minimo) && num(d.maximo) && Math.abs(d.maximo - d.minimo) > 1e-9; }
/* HTML de un dato: confirmado normal, estimado con rango y etiqueta, por confirmar en violeta discreto. */
/* Parcial: falta confirmar una parte, pero hay un número calculado con lo que sí se sabe. */

function datoHTML(d, o) {

/* Cuenta desplegable: la base del número, a la vista. */
function cuentaHTML(d, titulo) {

  if (arr(d.respuestas).length) h += '<div style="margin-top:6px">' + arr(d.respuestas).map(r => '<div><b>' + esc(r.fuente) + ':</b> ' + esc(r.valor) + '</div>').join('') + '</div>';

if (F1) {
